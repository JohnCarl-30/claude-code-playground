name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Generates PageProps/LayoutProps route types so tsc can check them.
      - name: Type-check
        run: npx next typegen && npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
