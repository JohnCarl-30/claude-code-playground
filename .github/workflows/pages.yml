name: Study site

# Publishes the study-only edition (the certification track as static files, no
# server and no Claude) to GitHub Pages on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Served from https://<owner>.github.io/<repo>/, so every link needs the repo name in front.
      - name: Build the study site
        run: npm run build:study
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Sign-in and progress sync (optional): the Supabase project's address and publishable key,
          # set as repository variables. Both are public by design; without them, sign-in is hidden.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Check nothing server-side got in
        run: test -f out/index.html && test ! -e out/api

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
